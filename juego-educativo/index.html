<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aventura del Saber · 1.º y 2.º de Primaria</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(#bde7ff,#e9f9d5);min-height:100vh;color:#2b2d42}
#app{max-width:640px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.9rem;margin:.2em 0;text-align:center}
h2{font-size:1.4rem;margin:.3em 0}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.12);margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:16px;font-size:1.25rem;font-weight:700;color:#fff;background:#4c6ef5;box-shadow:0 5px 0 #364fc7;cursor:pointer;margin:10px 0;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #364fc7}
.btn.green{background:#2f9e44;box-shadow:0 5px 0 #1b6e2e}
.btn.orange{background:#f76707;box-shadow:0 5px 0 #b54a04}
.btn.grey{background:#868e96;box-shadow:0 5px 0 #5c636a}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:1rem}
input[type=text]{width:100%;font-size:1.3rem;padding:12px;border-radius:14px;border:3px solid #adb5bd;font-family:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick{font-size:2.2rem;background:#f1f3f5;border:4px solid transparent;border-radius:16px;padding:6px 12px;cursor:pointer}
.pick.sel{border-color:#4c6ef5;background:#dbe4ff}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.1rem;gap:8px}
.chip{background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.subj{display:flex;align-items:center;gap:14px;font-size:1.4rem;font-weight:700}
.subj .ic{font-size:3rem}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lvl{background:#fff;border-radius:20px;padding:12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12);cursor:pointer;font-weight:700}
.lvl .ic{font-size:2.4rem}
.lvl.locked{opacity:.45;cursor:not-allowed}
.stars{font-size:1.3rem;letter-spacing:2px}
.bar{height:16px;background:#dee2e6;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:#40c057;transition:width .3s}
.q{font-size:1.6rem;font-weight:700;text-align:center;margin:10px 0;line-height:1.35}
.vis{font-size:2.2rem;text-align:center;margin:6px 0;line-height:1.3;word-break:break-word}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:0;border-radius:18px;padding:18px 8px;font-size:1.5rem;font-weight:700;background:#fff3bf;box-shadow:0 5px 0 #e0b400;cursor:pointer;font-family:inherit;color:#2b2d42}
.opt.ok{background:#8ce99a;box-shadow:0 5px 0 #2f9e44}
.opt.bad{background:#ffa8a8;box-shadow:0 5px 0 #e03131}
.fb{text-align:center;font-size:1.3rem;font-weight:700;min-height:2em}
.big{font-size:4rem;text-align:center}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:6px;border-bottom:1px solid #dee2e6;text-align:left}
.link{background:none;border:0;color:#364fc7;text-decoration:underline;font-size:1rem;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ utilidades ============ */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const lerp=(a,b,d)=>Math.round(a+(b-a)*d);
function mc(q,correct,wrongs,vis){
  correct=String(correct);
  let w=[...new Set(wrongs.map(String))].filter(x=>x!==correct);
  w=shuffle(w).slice(0,3);
  const opts=shuffle([correct,...w]);
  return {q,vis:vis||'',opts,a:opts.indexOf(correct)};
}
function numWrongs(c,max){
  const s=[c+1,c-1,c+2,c-2,c+10,c-10,c+3,c-3].filter(x=>x>=0&&(max==null||x<=max));
  return shuffle(s);
}
const numQ=(q,c,vis,max)=>mc(q,c,numWrongs(c,max),vis);

/* ============ contenido original ============ */
const OBJ=['🍎','⭐','🐟','🚗','🎈','🐞','🍪','🌸'];
const NOMBRES=['Ana','Leo','Mía','Hugo','Lola','Pablo'];
const ITEMS=[['manzanas','🍎'],['cromos','🃏'],['canicas','🔮'],['galletas','🍪'],['globos','🎈'],['lápices','✏️']];

 ['🍎','manzana',['man','za','na']],['🐱','gato',['ga','to']],['🏠','casa',['ca','sa']],['☀️','sol',['sol']],
 ['🌙','luna',['lu','na']],['🐶','perro',['pe','rro']],['🐟','pez',['pez']],['🚗','coche',['co','che']],
 ['🌳','árbol',['ár','bol']],['🍌','plátano',['plá','ta','no']],['🐴','caballo',['ca','ba','llo']],['⚽','pelota',['pe','lo','ta']],
 ['🚲','bici',['bi','ci']],['🍞','pan',['pan']],['🐘','elefante',['e','le','fan','te']],['📖','libro',['li','bro']],
 ['🦋','mariposa',['ma','ri','po','sa']],['🍇','uva',['u','va']],['🐢','tortuga',['tor','tu','ga']],['🎈','globo',['glo','bo']]
];
const VOWELS=[['c_sa','a','casa'],['p_lo','e','pelo'],['l_na','u','luna'],['m_sa','e','mesa'],['s_l','o','sol'],['p_ta','a','pata'],['b_ca','o','boca'],['m_no','a','mano'],['d_do','e','dedo'],['l_bro','i','libro'],['p_n','a','pan'],['t_ma','o','toma']];
const PLURAL1=[['el gato','los gatos'],['la casa','las casas'],['el perro','los perros'],['la flor','las flores'],['el libro','los libros'],['la mesa','las mesas'],['el niño','los niños'],['la luna','las lunas'],['el pez','los peces']];
const MAYUS=[['Sevilla','sevilla'],['Carlos','carlos'],['España','españa'],['Lucía','lucía'],['Madrid','madrid'],['Pablo','pablo'],['Andalucía','andalucía']];
const RIMAS=[['gato','pato',['mesa','luna']],['casa','masa',['pato','sol']],['sol','col',['luna','pan']],['pan','plan',['gato','mesa']],['luna','cuna',['casa','pez']],['pez','vez',['sol','perro']],['mesa','fresa',['pan','gato']],['nube','tube',['sol','casa']]];

const SIN=[['grande','enorme','pequeño'],['rápido','veloz','lento'],['bonito','guapo','feo'],['contento','alegre','triste'],['cansado','agotado','fresco'],['listo','inteligente','tonto']];
const ANT=[['alto','bajo'],['día','noche'],['caliente','frío'],['subir','bajar'],['abrir','cerrar'],['dentro','fuera'],['lleno','vacío'],['nuevo','viejo'],['limpio','sucio'],['feliz','triste']];

const PLURAL2=[['lápiz','lápices'],['pez','peces'],['luz','luces'],['flor','flores'],['balón','balones'],['árbol','árboles'],['reloj','relojes'],['tren','trenes'],['voz','voces'],['nariz','narices']];
const BV=[['v','vaca'],['b','burro'],['v','vaso'],['b','bote'],['v','uva'],['b','nube'],['v','lavar'],['b','bola'],['v','vela'],['b','bebé'],['v','nieve'],['b','barco'],['v','verano'],['b','cabeza']];
const HH=[['h','hueso'],['h','hormiga'],['h','hoja'],['h','helado'],['h','hielo'],['h','hambre'],['h','huevo'],['','oso'],['','ola'],['','isla'],['','uva'],['','ojo'],['','animal'],['','escuela']];
const FRASES=[['El gato duerme en el sofá','El','gato','duerme','en','el','sofá'],['Mi hermana come una manzana'],['Los niños juegan en el parque'],['La luna brilla de noche'],['Ana lee un libro divertido'],['El perro corre por el jardín']];
const CLASES=[['casa','nombre'],['mesa','nombre'],['correr','verbo'],['saltar','verbo'],['grande','adjetivo'],['rojo','adjetivo'],['perro','nombre'],['comer','verbo'],['alegre','adjetivo'],['libro','nombre'],['dormir','verbo'],['pequeño','adjetivo']];
const ABC=['abeja','barco','casa','dedo','espejo','foca','gato','helado','isla','jirafa','koala','luna','mano','nube','oso','pan','queso','rana','sol','tren','uva','vaca','zapato'];

/* ============ niveles ============ */
const M1=[
 {name:'Contar',icon:'🔢',gen:d=>{const n=rnd(2,lerp(8,20,d));const o=pick(OBJ);return numQ('¿Cuántos hay?',n,o.repeat(n),25)}},
 {name:'Mayor o menor',icon:'⚖️',gen:d=>{const m=lerp(20,99,d);let a=rnd(1,m),b=rnd(1,m);while(a===b)b=rnd(1,m);const may=Math.random()<.5;return mc(may?'¿Cuál es MAYOR?':'¿Cuál es MENOR?',may?Math.max(a,b):Math.min(a,b),[a,b],a+'  ó  '+b)}},
 {name:'Sumas',icon:'➕',gen:d=>{const m=lerp(10,20,d);const a=rnd(1,m-1),b=rnd(1,m-a);return numQ(`${a} + ${b} = ?`,a+b,'',40)}},
 {name:'Restas',icon:'➖',gen:d=>{const m=lerp(10,20,d);const a=rnd(2,m),b=rnd(1,a);return numQ(`${a} − ${b} = ?`,a-b,'',40)}},
 {name:'Series',icon:'🪜',gen:d=>{const st=pick(d<.5?[1,2]:[1,2,5,10]);const s=rnd(0,10);const seq=[0,1,2,3].map(i=>s+i*st);const hole=rnd(1,3);const c=seq[hole];const show=seq.map((x,i)=>i===hole?'❓':x).join(' , ');return numQ('¿Qué número falta?',c,show,200)}},
 {name:'Decenas y unidades',icon:'🧱',gen:d=>{const n=rnd(10,lerp(40,99,d));const dec=Math.floor(n/10),uni=n%10;return Math.random()<.5?numQ(`En el ${n}, ¿cuántas DECENAS hay?`,dec,'',9):numQ(`En el ${n}, ¿cuántas UNIDADES hay?`,uni,'',9)}},
 {name:'Figuras',icon:'🔺',gen:d=>{const f=[['triángulo','🔺',3],['cuadrado','🟦',4],['rectángulo','▬',4],['pentágono','⬟',5]];const x=pick(f);return numQ(`¿Cuántos lados tiene un ${x[0]}?`,x[2],x[1],8)}},
 {name:'Problemas',icon:'🧩',gen:d=>{const [it,e]=pick(ITEMS),n=pick(NOMBRES);const m=lerp(8,18,d);const a=rnd(2,m-1),b=rnd(1,m-a);if(Math.random()<.5)return numQ(`${n} tiene ${a} ${it} y le regalan ${b} más. ¿Cuántas tiene ahora?`,a+b,e.repeat(Math.min(a+b,12)),40);const a2=rnd(3,m),b2=rnd(1,a2-1);return numQ(`${n} tiene ${a2} ${it} y da ${b2}. ¿Cuántas le quedan?`,a2-b2,e.repeat(a2),40)}}
];
const M2=[
 {name:'Sumas hasta 100',icon:'➕',gen:d=>{let a,b;if(d<.4){a=rnd(10,60);b=rnd(1,9);}else{a=rnd(11,70);b=rnd(11,99-a>11?99-a:12);}if(a+b>100)b=100-a;return numQ(`${a} + ${b} = ?`,a+b,'',150)}},
 {name:'Restas hasta 100',icon:'➖',gen:d=>{const a=rnd(20,lerp(60,99,d));const b=rnd(2,a-1>Math.min(a,lerp(20,60,d))?lerp(20,60,d):a-1);return numQ(`${a} − ${b} = ?`,a-b,'',150)}},
 {name:'Tablas',icon:'✖️',gen:d=>{const ts=d<.35?[2,10]:d<.7?[2,5,10,3]:[2,3,4,5,10];const t=pick(ts),n=rnd(1,10);return numQ(`${t} × ${n} = ?`,t*n,'',110)}},
 {name:'Centenas, decenas…',icon:'🏗️',gen:d=>{const c=rnd(1,9),de=rnd(0,9),u=rnd(0,9);const n=c*100+de*10+u;if(Math.random()<.5)return numQ(`${c} centenas, ${de} decenas y ${u} unidades son…`,n,'',999);const w=pick([['centenas',c],['decenas',de],['unidades',u]]);return numQ(`En el ${n}, ¿cuántas ${w[0]} hay?`,w[1],'',9)}},
 {name:'Doble y mitad',icon:'🪞',gen:d=>{if(Math.random()<.5){const n=rnd(2,lerp(12,50,d));return numQ(`El DOBLE de ${n} es…`,n*2,'',120)}const n=rnd(1,lerp(10,40,d))*2;return numQ(`La MITAD de ${n} es…`,n/2,'',60)}},
 {name:'La hora',icon:'🕒',gen:d=>{const h=rnd(1,12);const half=d>.3&&Math.random()<.5;const on='🕐🕑🕒🕓🕔🕕🕖🕗🕘🕙🕚🕛'.match(/./gu),hf='🕜🕝🕞🕟🕠🕡🕢🕣🕤🕥🕦🕧'.match(/./gu);const txt=x=>`las ${x} en punto`;const c=half?`las ${h} y media`:`las ${h} en punto`;const wr=[half?`las ${h} en punto`:`las ${h} y media`,`las ${h%12+1} ${half?'y media':'en punto'}`,`las ${(h+10)%12+1} ${half?'y media':'en punto'}`,`las ${h%12+1} ${half?'en punto':'y media'}`];return mc('¿Qué hora marca el reloj?',`Son ${c}`,wr.map(x=>`Son ${x}`),(half?hf:on)[h-1])}},
 {name:'Dinero',icon:'💶',gen:d=>{const mons=d<.5?[1,2,5]:[1,2,5,10,20];let parts=[],tot=0;const k=rnd(2,d<.5?3:4);for(let i=0;i<k;i++){const m=pick(mons);parts.push(m);tot+=m}return numQ('¿Cuántos euros hay en total?',tot,parts.map(m=>m>=5&&m!==5?`💶${m}€`:`🪙${m}€`).join('  '),80)}},
 {name:'Problemas',icon:'🧩',gen:d=>{const [it,e]=pick(ITEMS),n=pick(NOMBRES);const t=rnd(0,2);if(t===0){const a=rnd(15,60),b=rnd(10,99-a);return numQ(`${n} tiene ${a} ${it} y consigue ${b} más. ¿Cuántas tiene?`,a+b,e,150)}if(t===1){const a=rnd(30,90),b=rnd(10,a-5);return numQ(`${n} tiene ${a} ${it} y pierde ${b}. ¿Cuántas le quedan?`,a-b,e,150)}const c=rnd(2,5),p=rnd(2,5);return numQ(`Hay ${c} cajas con ${p} ${it} en cada una. ¿Cuántas ${it} hay en total?`,c*p,e.repeat(Math.min(c*p,15)),40)}}
];
const L1=[
 {name:'Letra inicial',icon:'🔤',gen:d=>{const w=pick(WORDS1);const l=w[1][0].toUpperCase();const abc='ABCDEFGHIJLMNOPRSTUV'.split('');return mc('¿Con qué letra empieza?',l,shuffle(abc),w[0],w[1])}},
 {name:'Vocales',icon:'🅰️',gen:d=>{const v=pick(VOWELS);return mc('¿Qué vocal falta?',v[1],'aeiou'.split(''),v[0].replace('_','＿'))}},
 {name:'Completa la sílaba',icon:'🧩',gen:d=>{const w=pick(WORDS1.filter(x=>x[2].length>=2));const i=w[2].length-1;const miss=w[2][i];const pool=WORDS1.flatMap(x=>x[2]).filter(s=>s!==miss&&s.length>=2);return mc('¿Qué sílaba falta?',miss,pool,w[0]+'  '+w[2].slice(0,i).join('-')+'-＿')}},
 {name:'Cuenta sílabas',icon:'👏',gen:d=>{const w=pick(WORDS1);return numQ('¿Cuántas sílabas (palmadas) tiene?',w[2].length,w[0]+' '+w[1],5)}},
 {name:'Forma la palabra',icon:'🔀',gen:d=>{const w=pick(WORDS1.filter(x=>x[2].length>=2&&x[2].length<=3));const sh=shuffle(w[2]);const wr=[shuffle(w[2]).join(''),shuffle(w[2]).join(''),w[2].slice().reverse().join(''),w[2][0]+w[2][0]+w[2].slice(1).join('')];return mc('¿Qué palabra forman estas sílabas?',w[1],wr,sh.join('  ·  '))}},
 {name:'Singular y plural',icon:'👥',gen:d=>{const p=pick(PLURAL1);const wr=[p[0],p[1].replace(/^(los|las)/,m=>m==='los'?'las':'los'),p[0]+'s'];return mc(`${p[0]} → ¿cómo se dice si son varios?`,p[1],wr)}},
 {name:'Mayúsculas',icon:'🔠',gen:d=>{const m=pick(MAYUS);return mc('¿Cuál está bien escrita?',m[0],[m[1],m[0].toUpperCase()])}},
 {name:'Rimas',icon:'🎵',gen:d=>{const r=pick(RIMAS);return mc(`¿Qué palabra rima con «${r[0]}»?`,r[1],r[2])}}
];
const L2=[
 {name:'Sinónimos y antónimos',icon:'🔁',gen:d=>{if(Math.random()<.5){const s=pick(SIN);return mc(`¿Qué significa lo MISMO que «${s[0]}»?`,s[1],[s[2],...shuffle(ANT).slice(0,3).map(x=>x[0])])}const a=pick(ANT);return mc(`¿Cuál es lo CONTRARIO de «${a[0]}»?`,a[1],shuffle(ANT).filter(x=>x!==a).map(x=>x[0]))}},
 {name:'Masculino y femenino',icon:'🧑‍🤝‍🧑',gen:d=>{const g=pick(GENERO);const rev=Math.random()<.5;const [a,b]=rev?[g[1],g[0]]:g;return mc(`El contrario de «${a}» (masc./fem.) es…`,b,shuffle(GENERO).filter(x=>x!==g).map(x=>x[rev?1:0]).concat([a+'s']))}},
 {name:'Plurales',icon:'👥',gen:d=>{const p=pick(PLURAL2);return mc(`Plural de «${p[0]}»`,p[1],[p[0]+'s',p[0]+'es',p[0].slice(0,-1)+'s'].filter(x=>x!==p[1]).concat([p[0].slice(0,-1)+'ses']))}},
 {name:'B o V',icon:'🅱️',gen:d=>{const w=pick(BV);const i=w[1].indexOf(w[0]);return mc('¿Con B o con V?',w[0].toUpperCase(),['B','V'],w[1].slice(0,i)+'＿'+w[1].slice(i+1))}},
 {name:'Con H o sin H',icon:'🤫',gen:d=>{const w=pick(HH);const wr=w[0]?w[1].slice(1):'h'+w[1];return mc('¿Cuál está bien escrita?',w[1],[wr])}},
 {name:'Ordena la frase',icon:'🧵',gen:d=>{const f=pick(['El gato duerme en el sofá','Mi hermana come una manzana','Los niños juegan en el parque','La luna brilla de noche','Ana lee un libro divertido','El perro corre por el jardín']);const w=f.split(' ');const wr=[];for(let i=0;i<8&&wr.length<3;i++){const s=shuffle(w).join(' ');if(s!==f&&!wr.includes(s))wr.push(s)}return mc('¿Qué frase está bien ordenada?',f,wr)}},
 {name:'Nombre, verbo, adjetivo',icon:'🏷️',gen:d=>{const c=pick(CLASES);return mc(`«${c[0]}» es un…`,c[1],['nombre','verbo','adjetivo'])}},
 {name:'Orden alfabético',icon:'🔡',gen:d=>{const ws=shuffle(ABC).slice(0,3);const first=ws.slice().sort((a,b)=>a.localeCompare(b,'es'))[0];return mc('¿Cuál va PRIMERO en el abecedario?',first,ws.filter(x=>x!==first),ws.join('  ·  '))}}
];
const CONT={'1':{mates:M1,lengua:L1},'2':{mates:M2,lengua:L2}};
const SUBJ={mates:{name:'Matemáticas',icon:'🧮',col:'#4c6ef5'},lengua:{name:'Lengua',icon:'📚',col:'#f76707'}};
const AVATARS=['🦊','🐼','🐯','🦁','🐸','🦄','🐙','🚀'];
const PREMIOS=[['🎩',20],['😎',40],['👑',70],['🏆',110]];

/* ============ estado ============ */
const KEY='aventura-saber-v1';
let S=null;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=document.getElementById('app');
const stars=(n)=>'⭐'.repeat(n)+'☆'.repeat(3-n);

function speak(t){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[＿❓]/g,' blanco ').replace(/[^\p{L}\p{N}¿?¡!.,%€×−+ ]/gu,' '));
  u.lang='es-ES';u.rate=.85;speechSynthesis.speak(u);
}
function beep(ok){
  try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
  o.frequency.value=ok?660:200;o.type=ok?'sine':'square';g.gain.value=.08;o.start();
  if(ok)o.frequency.setValueAtTime(880,c.currentTime+.1);o.stop(c.currentTime+.25)}catch(e){}
}

/* ============ pantallas ============ */
function render(h){$.innerHTML=h}

function start(){
  if(S){home();return}
  let grade='1',av=AVATARS[0],nombre='';
  const draw=()=>{
    render(`<h1>🌟 Aventura del Saber</h1>
    <div class="card"><h2>¿Cómo te llamas?</h2><input id="nm" type="text" placeholder="Tu nombre" maxlength="14">
    <h2>Elige tu curso</h2><div class="row">
      <div class="pick ${grade==='1'?'sel':''}" data-g="1" style="font-size:1.5rem">1.º Primaria</div>
      <div class="pick ${grade==='2'?'sel':''}" data-g="2" style="font-size:1.5rem">2.º Primaria</div></div>
    <h2>Elige tu compañero</h2><div class="row">${AVATARS.map(a=>`<div class="pick ${a===av?'sel':''}" data-a="${a}">${a}</div>`).join('')}</div>
    <button class="btn green" id="go">¡Empezar!</button></div>`);
    const nm=$.querySelector('#nm');nm.value=nombre;nm.oninput=()=>nombre=nm.value;
    $.querySelectorAll('[data-g]').forEach(e=>e.onclick=()=>{grade=e.dataset.g;draw()});
    $.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{av=e.dataset.a;draw()});
    $.querySelector('#go').onclick=()=>{
      const n=nombre.trim();if(!n){nm.focus();return}
      S={name:n,grade,avatar:av,coins:0,stars:{},stats:{},prizes:[],played:0};save();home();
    };
  };draw();
}

function topbar(back){
  return `<div class="top">${back?`<button class="btn small grey" id="back">← Atrás</button>`:`<span class="chip">${S.avatar} ${S.name} · ${S.grade}.º</span>`}
  <span class="chip">🪙 ${S.coins}</span></div>`;
}

function home(){
  const totalStars=Object.values(S.stars).reduce((a,b)=>a+b,0);
  const prize=S.prizes.map(p=>p).join('');
  render(`${topbar()}
  <h1>${S.avatar}${prize} ¡Hola, ${S.name}!</h1>
  <div class="card" style="text-align:center">Llevas <b>${totalStars} ⭐</b> y <b>${S.coins} 🪙</b></div>
  ${Object.keys(SUBJ).map(k=>`<div class="card subj" data-s="${k}" style="cursor:pointer;border-left:10px solid ${SUBJ[k].col}">
    <span class="ic">${SUBJ[k].icon}</span><div>${SUBJ[k].name}<div class="stars" style="font-size:1rem;font-weight:400">${subjStars(k)} / ${CONT[S.grade][k].length*3} ⭐</div></div></div>`).join('')}
  <button class="btn orange" id="shop">🎁 Tienda de premios</button>
  <button class="btn grey" id="par">👨‍👩‍👦 Panel de padres</button>`);
  $.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>map(e.dataset.s));
  $.querySelector('#shop').onclick=shop;
  $.querySelector('#par').onclick=parents;
}
const subjStars=k=>CONT[S.grade][k].reduce((a,_,i)=>a+(S.stars[`${S.grade}-${k}-${i}`]||0),0);

function map(k){
  const L=CONT[S.grade][k];
  render(`${topbar(true)}<h1>${SUBJ[k].icon} ${SUBJ[k].name}</h1>
  <div class="map">${L.map((l,i)=>{
    const st=S.stars[`${S.grade}-${k}-${i}`]||0;
    const un=i===0||(S.stars[`${S.grade}-${k}-${i-1}`]||0)>0;
    return `<div class="lvl ${un?'':'locked'}" data-i="${i}"><div class="ic">${un?l.icon:'🔒'}</div>${i+1}. ${l.name}<div class="stars">${stars(st)}</div></div>`}).join('')}</div>
  <p style="text-align:center">Consigue al menos 1 ⭐ para abrir el siguiente nivel.</p>`);
  $.querySelector('#back').onclick=home;
  $.querySelectorAll('.lvl:not(.locked)').forEach(e=>e.onclick=()=>play(k,+e.dataset.i));
}

function play(k,i){
  const lv=CONT[S.grade][k][i];const N=10;let n=0,ok=0,streak=0,seen=new Set();
  const next=()=>{
    if(n>=N)return finish();
    const d=n/(N-1);let q,t=0;
    do{q=lv.gen(d);t++}while(seen.has(q.q+q.vis)&&t<10);seen.add(q.q+q.vis);
    render(`${topbar(true)}
    <div class="bar"><div style="width:${n/N*100}%"></div></div>
    <div class="card"><div class="top"><span>Pregunta ${n+1}/${N}</span><button class="btn small" id="say">🔊 Escuchar</button></div>
    <div class="q">${q.q}</div><div class="vis">${q.vis}</div>
    <div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div>
    <div class="fb" id="fb"></div></div>`);
    $.querySelector('#back').onclick=()=>map(k);
    const txt=q.q+'. '+q.vis.replace(/(\p{Extended_Pictographic}️?)+/gu,' ');
    $.querySelector('#say').onclick=()=>speak(txt);
    if(S.grade==='1')speak(txt);
    let done=false;
    $.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(done)return;done=true;const j=+b.dataset.j;const good=j===q.a;
      S.stats[k]=S.stats[k]||{ok:0,total:0};S.stats[k].total++;
      const fb=$.querySelector('#fb');
      if(good){ok++;streak++;S.stats[k].ok++;b.classList.add('ok');fb.textContent=pick(['¡Muy bien! 🎉','¡Genial! 🌟','¡Eso es! 👏','¡Correcto! 💪']);if(streak>=3)fb.textContent+=` 🔥 Racha de ${streak}`;beep(true)}
      else{streak=0;b.classList.add('bad');$.querySelectorAll('.opt')[q.a].classList.add('ok');fb.textContent='Casi… la respuesta era la verde 💡';beep(false)}
      save();n++;setTimeout(next,good?900:1900);
    });
  };
  const finish=()=>{
    const st=ok>=9?3:ok>=7?2:ok>=5?1:0;
    const key=`${S.grade}-${k}-${i}`;const prev=S.stars[key]||0;
    const gain=ok*2+(st>prev?(st-prev)*5:0);
    if(st>prev)S.stars[key]=st;S.coins+=gain;S.played++;save();
    const last=i===CONT[S.grade][k].length-1;
    render(`${topbar()}<div class="card"><div class="big">${st>0?'🎉':'💪'}</div>
    <h1>${st>0?'¡Nivel superado!':'¡Casi lo consigues!'}</h1>
    <div class="q">${ok} de ${N} bien</div><div class="big stars">${stars(st)}</div>
    <div class="q">+${gain} 🪙</div>
    ${st===0?'<p style="text-align:center">Necesitas 5 aciertos para ganar una estrella. ¡Otra vez!</p>':''}
    <button class="btn green" id="again">🔁 Repetir</button>
    ${st>0&&!last?'<button class="btn" id="nx">➡️ Siguiente nivel</button>':''}
    <button class="btn grey" id="mp">🗺️ Volver al mapa</button></div>`);
    $.querySelector('#again').onclick=()=>play(k,i);
    const nx=$.querySelector('#nx');if(nx)nx.onclick=()=>play(k,i+1);
    $.querySelector('#mp').onclick=()=>map(k);
  };
  next();
}

function shop(msg){
  render(`${topbar(true)}<h1>🎁 Tienda</h1><p style="text-align:center">${msg||'Estos premios se ponen junto a tu compañero.'}</p>
  ${PREMIOS.map(([e,c])=>{const own=S.prizes.includes(e);return `<div class="card subj"><span class="ic">${e}</span><div style="flex:1">${c} 🪙</div>
  <button class="btn small ${own?'grey':'green'}" data-e="${e}" data-c="${c}">${own?'Tuyo ✓':'Comprar'}</button></div>`}).join('')}`);
  $.querySelector('#back').onclick=home;
  $.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
    const e=b.dataset.e,c=+b.dataset.c;if(S.prizes.includes(e))return;
    if(S.coins<c){shop('Aún no tienes monedas suficientes. ¡Sigue jugando! 💪');return}
    S.coins-=c;S.prizes.push(e);save();shop();
  });
}

function parents(){
  const rows=['1','2'].flatMap(g=>Object.keys(SUBJ).flatMap(k=>CONT[g][k].map((l,i)=>{
    const s=S.stars[`${g}-${k}-${i}`]||0;return `<tr><td>${g}.º</td><td>${SUBJ[k].name}</td><td>${l.name}</td><td>${s?stars(s):'—'}</td></tr>`}))).join('');
  const acc=k=>{const s=S.stats[k];return s&&s.total?Math.round(s.ok/s.total*100)+'% ('+s.ok+'/'+s.total+')':'sin datos'};
  render(`${topbar(true)}<h1>Panel de padres</h1>
  <div class="card"><b>Jugador:</b> ${S.name} · ${S.grade}.º de Primaria<br><b>Partidas:</b> ${S.played}<br>
  <b>Aciertos Matemáticas:</b> ${acc('mates')}<br><b>Aciertos Lengua:</b> ${acc('lengua')}</div>
  <div class="card"><table><tr><th>Curso</th><th>Área</th><th>Nivel</th><th>Nota</th></tr>${rows}</table></div>
  <div class="card"><b>Cambiar de curso</b> (conserva el progreso de ambos):
  <button class="btn" id="sw">Pasar a ${S.grade==='1'?'2.º':'1.º'} de Primaria</button>
  <button class="link" id="rs">Borrar todo el progreso</button><span id="rsq"></span></div>`);
  $.querySelector('#back').onclick=home;
  $.querySelector('#sw').onclick=()=>{S.grade=S.grade==='1'?'2':'1';save();home()};
  $.querySelector('#rs').onclick=()=>{$.querySelector('#rsq').innerHTML=' <b>¿Seguro?</b> <button class="link" id="rs2">Sí, borrar</button>';$.querySelector('#rs2').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;start()}};
}
start();
</script>
</body>
</html>
