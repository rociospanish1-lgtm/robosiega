<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aventura del Saber · 1.º y 2.º de Primaria</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aventura">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4c6ef5">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(#bde7ff,#e9f9d5);min-height:100vh;color:#2b2d42}
#app{max-width:640px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.9rem;margin:.2em 0;text-align:center}
h2{font-size:1.4rem;margin:.3em 0}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.12);margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:16px;font-size:1.25rem;font-weight:700;color:#fff;background:#4c6ef5;box-shadow:0 5px 0 #364fc7;cursor:pointer;margin:10px 0;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #364fc7}
.btn.green{background:#2f9e44;box-shadow:0 5px 0 #1b6e2e}
.btn.orange{background:#f76707;box-shadow:0 5px 0 #b54a04}
.btn.grey{background:#868e96;box-shadow:0 5px 0 #5c636a}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:1rem}
input[type=text]{width:100%;font-size:1.3rem;padding:12px;border-radius:14px;border:3px solid #adb5bd;font-family:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick{font-size:2.2rem;background:#f1f3f5;border:4px solid transparent;border-radius:16px;padding:6px 12px;cursor:pointer}
.pick.sel{border-color:#4c6ef5;background:#dbe4ff}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.1rem;gap:8px}
.chip{background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.subj{display:flex;align-items:center;gap:14px;font-size:1.4rem;font-weight:700}
.subj .ic{font-size:3rem}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lvl{background:#fff;border-radius:20px;padding:12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12);cursor:pointer;font-weight:700}
.lvl .ic{font-size:2.4rem}
.lvl.locked{opacity:.45;cursor:not-allowed}
.stars{font-size:1.3rem;letter-spacing:2px}
.bar{height:16px;background:#dee2e6;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:#40c057;transition:width .3s}
.q{font-size:1.6rem;font-weight:700;text-align:center;margin:10px 0;line-height:1.35}
.vis{font-size:2.2rem;text-align:center;margin:6px 0;line-height:1.3;word-break:break-word}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:0;border-radius:18px;padding:18px 8px;font-size:1.5rem;font-weight:700;background:#fff3bf;box-shadow:0 5px 0 #e0b400;cursor:pointer;font-family:inherit;color:#2b2d42}
.opt.ok{background:#8ce99a;box-shadow:0 5px 0 #2f9e44}
.opt.bad{background:#ffa8a8;box-shadow:0 5px 0 #e03131}
.fb{text-align:center;font-size:1.3rem;font-weight:700;min-height:2em}
.big{font-size:4rem;text-align:center}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:6px;border-bottom:1px solid #dee2e6;text-align:left}
.link{background:none;border:0;color:#364fc7;text-decoration:underline;font-size:1rem;cursor:pointer;font-family:inherit}

.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.it{font-size:2.3rem;background:#f8f9fa;border:3px solid transparent;border-radius:14px;padding:2px 6px;cursor:pointer;opacity:.85;font-family:inherit}
.it.on{border-color:#40c057;background:#d3f9d8;opacity:1;transform:scale(1.1)}
.counter{font-size:2.6rem;font-weight:800;text-align:center;color:#4c6ef5;margin:6px 0}
.clap{display:block;margin:6px auto;font-size:4.5rem;background:#fff3bf;border:0;border-radius:50%;width:130px;height:130px;box-shadow:0 7px 0 #e0b400;cursor:pointer}
.rg{width:100%;height:46px;accent-color:#4c6ef5}
.ends{display:flex;justify-content:space-between;font-weight:700;color:#868e96}
.hint{text-align:center;color:#868e96;font-size:.95rem;margin:6px 0}
.slots,.bank{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tile{display:inline-block;min-width:54px;padding:12px 14px;margin:5px;background:#fff3bf;border-radius:14px;box-shadow:0 4px 0 #e0b400;font-size:1.6rem;font-weight:700;text-align:center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;border:0;font-family:inherit;color:#2b2d42;position:relative}
.tile.hole{visibility:hidden}
.tile.chip{font-size:1.25rem;min-width:0}
.tile.okc{background:#8ce99a;box-shadow:0 4px 0 #2f9e44;cursor:default}
.tile.sel{outline:4px solid #4c6ef5}
.tile sup{font-size:.8rem;margin-left:4px}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;transform:scale(1.12) rotate(-3deg)}
.slot{min-width:60px;min-height:64px;border:3px dashed #adb5bd;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin:5px;background:#f8f9fa}
.slot .tile{margin:0}
.slot small{color:#adb5bd;font-weight:800;font-size:1.3rem}
.slot.ok{border-color:#2f9e44;background:#d3f9d8}.slot.bad{border-color:#e03131;background:#ffe3e3}
.baskets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.basket{border:3px dashed #4c6ef5;border-radius:16px;background:#edf2ff;padding:6px;min-height:130px;text-align:center}
.basket b{display:block;font-size:1.05rem;color:#364fc7}
.basket .tile{margin:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two>div{display:flex;flex-direction:column;gap:10px}
.mt{border:0;border-radius:14px;padding:14px 6px;font-size:1.25rem;font-weight:700;background:#fff3bf;box-shadow:0 4px 0 #e0b400;cursor:pointer;font-family:inherit;color:#2b2d42}
.mt.sel{background:#a5d8ff;box-shadow:0 4px 0 #339af0}
.mt.okc{background:#8ce99a;box-shadow:0 4px 0 #2f9e44}
.target{text-align:center;font-size:1.3rem}
.purse{text-align:center;font-size:1.6rem;min-height:2.2em;word-break:break-word}
.coins{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0}
.coin{width:70px;height:70px;border-radius:50%;border:0;font-weight:800;font-size:1.3rem;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.coin:active{transform:translateY(4px)}
.c1,.c2,.c5{background:#f1c40f;color:#5c4a00}.c10,.c20{background:#ced4da;color:#343a40}
.coin.c2,.mini.c2{background:#e8b30c}.coin.c5,.mini.c5{background:#d99a0b;color:#fff}
.mini{display:inline-block;width:26px;height:26px;border-radius:50%;font-size:.8rem;line-height:26px;font-style:normal;font-weight:800;margin:1px}
.clock{display:block;width:210px;margin:6px auto}
.me{position:absolute;top:-12px;right:-6px;font-size:2rem;animation:hop 1s infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.lvl{position:relative}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1000}
.fx span{position:absolute;top:-40px;animation:fall 2.1s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
button:disabled{cursor:default}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ utilidades ============ */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const lerp=(a,b,d)=>Math.round(a+(b-a)*d);
function mc(q,correct,wrongs,vis){
  correct=String(correct);
  let w=[...new Set(wrongs.map(String))].filter(x=>x!==correct);
  w=shuffle(w).slice(0,3);
  const opts=shuffle([correct,...w]);
  return {q,vis:vis||'',opts,a:opts.indexOf(correct)};
}
function numWrongs(c,max){
  const s=[c+1,c-1,c+2,c-2,c+10,c-10,c+3,c-3].filter(x=>x>=0&&(max==null||x<=max));
  return shuffle(s);
}
const numQ=(q,c,vis,max)=>mc(q,c,numWrongs(c,max),vis);

/* ============ contenido original ============ */
const OBJ=['🍎','⭐','🐟','🚗','🎈','🐞','🍪','🌸'];
const NOMBRES=['Ana','Leo','Mía','Hugo','Lola','Pablo'];
const ITEMS=[['manzanas','🍎'],['cromos','🃏'],['canicas','🔮'],['galletas','🍪'],['globos','🎈'],['lápices','✏️']];

const WORDS1=[ // emoji, palabra, sílabas
 ['🍎','manzana',['man','za','na']],['🐱','gato',['ga','to']],['🏠','casa',['ca','sa']],['☀️','sol',['sol']],
 ['🌙','luna',['lu','na']],['🐶','perro',['pe','rro']],['🐟','pez',['pez']],['🚗','coche',['co','che']],
 ['🌳','árbol',['ár','bol']],['🍌','plátano',['plá','ta','no']],['🐴','caballo',['ca','ba','llo']],['⚽','pelota',['pe','lo','ta']],
 ['🚲','bici',['bi','ci']],['🍞','pan',['pan']],['🐘','elefante',['e','le','fan','te']],['📖','libro',['li','bro']],
 ['🦋','mariposa',['ma','ri','po','sa']],['🍇','uva',['u','va']],['🐢','tortuga',['tor','tu','ga']],['🎈','globo',['glo','bo']]
];
const VOWELS=[['c_sa','a','casa'],['p_lo','e','pelo'],['l_na','u','luna'],['m_sa','e','mesa'],['s_l','o','sol'],['p_ta','a','pata'],['b_ca','o','boca'],['m_no','a','mano'],['d_do','e','dedo'],['l_bro','i','libro'],['p_n','a','pan'],['t_ma','o','toma']];
const PLURAL1=[['el gato','los gatos'],['la casa','las casas'],['el perro','los perros'],['la flor','las flores'],['el libro','los libros'],['la mesa','las mesas'],['el niño','los niños'],['la luna','las lunas'],['el pez','los peces']];
const MAYUS=[['Sevilla','sevilla'],['Carlos','carlos'],['España','españa'],['Lucía','lucía'],['Madrid','madrid'],['Pablo','pablo'],['Andalucía','andalucía']];
const RIMAS=[['gato','pato',['mesa','luna']],['casa','masa',['pato','sol']],['sol','col',['luna','pan']],['pan','plan',['gato','mesa']],['luna','cuna',['casa','pez']],['pez','vez',['sol','perro']],['mesa','fresa',['pan','gato']],['nube','tube',['sol','casa']]];

const SIN=[['grande','enorme','pequeño'],['rápido','veloz','lento'],['bonito','guapo','feo'],['contento','alegre','triste'],['cansado','agotado','fresco'],['listo','inteligente','tonto']];
const ANT=[['alto','bajo'],['día','noche'],['caliente','frío'],['subir','bajar'],['abrir','cerrar'],['dentro','fuera'],['lleno','vacío'],['nuevo','viejo'],['limpio','sucio'],['feliz','triste']];
const GENERO=[['niño','niña'],['gato','gata'],['profesor','profesora'],['rey','reina'],['perro','perra'],['abuelo','abuela'],['hermano','hermana'],['león','leona'],['amigo','amiga']];
const PLURAL2=[['lápiz','lápices'],['pez','peces'],['luz','luces'],['flor','flores'],['balón','balones'],['árbol','árboles'],['reloj','relojes'],['tren','trenes'],['voz','voces'],['nariz','narices']];
const BV=[['v','vaca'],['b','burro'],['v','vaso'],['b','bote'],['v','uva'],['b','nube'],['v','lavar'],['b','bola'],['v','vela'],['b','bebé'],['v','nieve'],['b','barco'],['v','verano'],['b','cabeza']];
const HH=[['h','hueso'],['h','hormiga'],['h','hoja'],['h','helado'],['h','hielo'],['h','hambre'],['h','huevo'],['','oso'],['','ola'],['','isla'],['','uva'],['','ojo'],['','animal'],['','escuela']];
const FRASES=[['El gato duerme en el sofá','El','gato','duerme','en','el','sofá'],['Mi hermana come una manzana'],['Los niños juegan en el parque'],['La luna brilla de noche'],['Ana lee un libro divertido'],['El perro corre por el jardín']];
const CLASES=[['casa','nombre'],['mesa','nombre'],['correr','verbo'],['saltar','verbo'],['grande','adjetivo'],['rojo','adjetivo'],['perro','nombre'],['comer','verbo'],['alegre','adjetivo'],['libro','nombre'],['dormir','verbo'],['pequeño','adjetivo']];
const ABC=['abeja','barco','casa','dedo','espejo','foca','gato','helado','isla','jirafa','koala','luna','mano','nube','oso','pan','queso','rana','sol','tren','uva','vaca','zapato'];

/* ============ niveles ============ */
const uniq=(k,m)=>{const s=new Set();while(s.size<k)s.add(rnd(1,m));return [...s]};
const scr=a=>{let r=shuffle(a),t=0;while(r.join('|')===a.join('|')&&t++<9)r=shuffle(a);return r};
const pairsQ=(q,arr)=>({type:'match',q,pairs:arr});
const M1=[
 {name:'Contar',icon:'🔢',gen:d=>({type:'count',q:'Toca cada dibujo para contarlo y pulsa ¡Listo!',item:pick(OBJ),n:rnd(2,lerp(8,20,d))})},
 {name:'Mayor o menor',icon:'⚖️',gen:d=>{const m=lerp(20,99,d);
   if(Math.random()<.5){const it=uniq(3,m),asc=Math.random()<.5;return {type:'order',q:asc?'Toca los números de MENOR a MAYOR':'Toca los números de MAYOR a MENOR',items:it,sorted:it.slice().sort((a,b)=>asc?a-b:b-a)}}
   let a=rnd(1,m),b=rnd(1,m);while(a===b)b=rnd(1,m);const may=Math.random()<.5;return mc(may?'¿Cuál es MAYOR?':'¿Cuál es MENOR?',may?Math.max(a,b):Math.min(a,b),[a,b],a+'  ó  '+b)}},
 {name:'Sumas',icon:'➕',gen:d=>{const m=lerp(10,20,d);const a=rnd(1,m-1),b=rnd(1,m-a);
   if(Math.random()<.4)return {type:'slider',q:`${a} + ${b} = ?  Mueve el control hasta el resultado`,target:a+b,min:0,max:20};
   return numQ(`${a} + ${b} = ?`,a+b,'',40)}},
 {name:'Restas',icon:'➖',gen:d=>{const m=lerp(10,20,d);const a=rnd(2,m),b=rnd(1,a);
   if(Math.random()<.4)return {type:'slider',q:`${a} − ${b} = ?  Mueve el control hasta el resultado`,target:a-b,min:0,max:20};
   return numQ(`${a} − ${b} = ?`,a-b,'',40)}},
 {name:'Series',icon:'🪜',gen:d=>{const st=pick(d<.5?[1,2]:[1,2,5,10]);const s=rnd(0,10);const seq=[0,1,2,3].map(i=>s+i*st);const hole=rnd(1,3);const c=seq[hole];const show=seq.map((x,i)=>i===hole?'❓':x).join(' , ');return numQ('¿Qué número falta?',c,show,200)}},
 {name:'Decenas y unidades',icon:'🧱',gen:d=>{const n=rnd(10,lerp(40,99,d));const dec=Math.floor(n/10),uni=n%10;return Math.random()<.5?numQ(`En el ${n}, ¿cuántas DECENAS hay?`,dec,'',9):numQ(`En el ${n}, ¿cuántas UNIDADES hay?`,uni,'',9)}},
 {name:'Figuras',icon:'🔺',gen:d=>{const f=[['triángulo','🔺',3],['cuadrado','🟦',4],['rectángulo','▬',4],['pentágono','⬟',5]];const x=pick(f);return numQ(`¿Cuántos lados tiene un ${x[0]}?`,x[2],x[1],8)}},
 {name:'Problemas',icon:'🧩',gen:d=>{const [it,e]=pick(ITEMS),n=pick(NOMBRES);const m=lerp(8,18,d);const a=rnd(2,m-1),b=rnd(1,m-a);if(Math.random()<.5)return numQ(`${n} tiene ${a} ${it} y le regalan ${b} más. ¿Cuántas tiene ahora?`,a+b,e.repeat(Math.min(a+b,12)),40);const a2=rnd(3,m),b2=rnd(1,a2-1);return numQ(`${n} tiene ${a2} ${it} y da ${b2}. ¿Cuántas le quedan?`,a2-b2,e.repeat(a2),40)}},
 {name:'Recta numérica',icon:'🧭',gen:d=>{const max=d<.5?20:30;const t=rnd(1,max);return {type:'slider',q:`Mueve el control hasta el número ${t}`,target:t,min:0,max}}},
 {name:'Monedas',icon:'🪙',gen:d=>{const t=rnd(3,lerp(8,15,d));return {type:'coins',q:`Paga exactamente ${t} €. Toca las monedas`,target:t,coins:[1,2,5]}}},
 {name:'Relojes',icon:'🕒',gen:d=>{const h=rnd(1,12);return {type:'clock',h,half:false,q:`Pon el reloj a las ${h} en punto`}}}
];
const M2=[
 {name:'Sumas hasta 100',icon:'➕',gen:d=>{let a,b;if(d<.4){a=rnd(10,60);b=rnd(1,9);}else{a=rnd(11,70);b=rnd(11,99-a>11?99-a:12);}if(a+b>100)b=100-a;return numQ(`${a} + ${b} = ?`,a+b,'',150)}},
 {name:'Restas hasta 100',icon:'➖',gen:d=>{const a=rnd(20,lerp(60,99,d));const b=rnd(2,a-1>Math.min(a,lerp(20,60,d))?lerp(20,60,d):a-1);return numQ(`${a} − ${b} = ?`,a-b,'',150)}},
 {name:'Tablas',icon:'✖️',gen:d=>{const ts=d<.35?[2,10]:d<.7?[2,5,10,3]:[2,3,4,5,10];
   if(Math.random()<.4){const ps=[],seen=new Set();let g=0;while(ps.length<4&&g++<60){const t=pick(ts),n=rnd(1,10);if(!seen.has(t*n)){seen.add(t*n);ps.push([`${t} × ${n}`,String(t*n)])}}return pairsQ('Une cada multiplicación con su resultado',ps)}
   const t=pick(ts),n=rnd(1,10);return numQ(`${t} × ${n} = ?`,t*n,'',110)}},
 {name:'Centenas, decenas…',icon:'🏗️',gen:d=>{const c=rnd(1,9),de=rnd(0,9),u=rnd(0,9);const n=c*100+de*10+u;
   if(Math.random()<.5)return {type:'build',q:`Forma el número: ${c} centenas, ${de} decenas y ${u} unidades`,tiles:scr([c,de,u].map(String)),target:[c,de,u].map(String),slotLabels:['C','D','U'],join:''};
   const w=pick([['centenas',c],['decenas',de],['unidades',u]]);return numQ(`En el ${n}, ¿cuántas ${w[0]} hay?`,w[1],'',9)}},
 {name:'Doble y mitad',icon:'🪞',gen:d=>{if(Math.random()<.45){const ns=uniq(4,lerp(12,40,d));return pairsQ('Une cada número con su DOBLE',ns.map(n=>[`doble de ${n}`,String(n*2)]))}
   if(Math.random()<.5){const n=rnd(2,lerp(12,50,d));return numQ(`El DOBLE de ${n} es…`,n*2,'',120)}const n=rnd(1,lerp(10,40,d))*2;return numQ(`La MITAD de ${n} es…`,n/2,'',60)}},
 {name:'La hora',icon:'🕒',gen:d=>{const h=rnd(1,12);const half=d>.3&&Math.random()<.5;return {type:'clock',h,half,q:`Pon el reloj a las ${h} ${half?'y media':'en punto'}`}}},
 {name:'Dinero',icon:'💶',gen:d=>{const t=rnd(6,lerp(20,60,d));return {type:'coins',q:`Paga exactamente ${t} €. Toca las monedas`,target:t,coins:[1,2,5,10,20]}}},
 {name:'Problemas',icon:'🧩',gen:d=>{const [it,e]=pick(ITEMS),n=pick(NOMBRES);const t=rnd(0,2);if(t===0){const a=rnd(15,60),b=rnd(10,99-a);return numQ(`${n} tiene ${a} ${it} y consigue ${b} más. ¿Cuántas tiene?`,a+b,e,150)}if(t===1){const a=rnd(30,90),b=rnd(10,a-5);return numQ(`${n} tiene ${a} ${it} y pierde ${b}. ¿Cuántas le quedan?`,a-b,e,150)}const c=rnd(2,5),p=rnd(2,5);return numQ(`Hay ${c} cajas con ${p} ${it} en cada una. ¿Cuántas ${it} hay en total?`,c*p,e.repeat(Math.min(c*p,15)),40)}}
];
const L1=[

function speak(t){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[＿❓]/g,' blanco ').replace(/[^\p{L}\p{N}¿?¡!.,%€×−+ ]/gu,' '));
  u.lang='es-ES';u.rate=.85;speechSynthesis.speak(u);
}
function beep(ok){
  try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
  o.frequency.value=ok?660:200;o.type=ok?'sine':'square';g.gain.value=.08;o.start();
  if(ok)o.frequency.setValueAtTime(880,c.currentTime+.1);o.stop(c.currentTime+.25)}catch(e){}
}

/* ============ motor interactivo ============ */
const R={};
const shakeEl=e=>{e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')};

/* arrastrar con dedo o ratón; si apenas se mueve cuenta como toque */
function drag(el,onDrop,onTap){
  el.style.touchAction='none';
  el.onpointerdown=e=>{
    e.preventDefault();
    const r=el.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;let moved=false;
    const g=el.cloneNode(true);g.classList.add('ghost');g.style.left=r.left+'px';g.style.top=r.top+'px';g.style.width=r.width+'px';
    const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!moved&&Math.hypot(dx,dy)>8){moved=true;document.body.appendChild(g);el.style.opacity=.3}
      if(moved){g.style.left=r.left+dx+'px';g.style.top=r.top+dy+'px'}};
    const up=ev=>{
      window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      g.remove();el.style.opacity='';
      if(!moved){onTap&&onTap();return}
      const t=document.elementsFromPoint(ev.clientX,ev.clientY).find(x=>x.dataset&&x.dataset.drop!==undefined);
      onDrop&&onDrop(t);
    };
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  };
}

/* construir: letras, sílabas, palabras o cifras en casillas (arrastrar o tocar) */
R.build=(q,st,done)=>{
  const n=q.target.length,slots=Array(n).fill(null);let fin=false;
  const draw=()=>{
    st.innerHTML=`<div class="vis">${q.vis||''}</div>
    <div class="slots">${slots.map((t,i)=>`<div class="slot" data-drop="${i}">${t===null?(q.slotLabels?`<small>${q.slotLabels[i]}</small>`:''):`<span class="tile" data-s="${i}">${q.tiles[t]}</span>`}</div>`).join('')}</div>
    <div class="bank">${q.tiles.map((t,i)=>slots.includes(i)?`<span class="tile hole">${t}</span>`:`<span class="tile" data-t="${i}">${t}</span>`).join('')}</div>
    <div class="hint">Toca o arrastra las fichas</div>`;
    if(fin)return;
    st.querySelectorAll('[data-t]').forEach(el=>{const i=+el.dataset.t;
      drag(el,t=>{if(t&&t.dataset.drop!==undefined)place(i,+t.dataset.drop)},()=>place(i));});
    st.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>{slots[+el.dataset.s]=null;draw()});
  };
  const place=(i,slot)=>{
    if(fin)return;
    if(slot===undefined||slots[slot]!==null)slot=slots.indexOf(null);
    if(slot<0)return;slots[slot]=i;draw();
    if(!slots.includes(null)){
      fin=true;const got=slots.map(x=>q.tiles[x]).join(q.join),want=q.target.join(q.join),good=got===want;
      st.querySelectorAll('.slot').forEach(s=>s.classList.add(good?'ok':'bad'));
      done(good,`era «${want}»`);
    }
  };
  draw();
};

/* clasificar en cestas */
R.sort=(q,st,done)=>{

  st.innerHTML=`<div class="baskets">${q.cats.map(c=>`<div class="basket" data-drop="${c}"><b>${c}</b><div class="inb"></div></div>`).join('')}</div>

  const put=(i,c)=>{
    const el=st.querySelector(`[data-w="${i}"]`);if(!el||el.dataset.done)return;
    if(q.words[i].c===c){
      el.dataset.done=1;el.onpointerdown=null;el.classList.remove('sel');el.classList.add('okc');
      st.querySelector(`[data-drop="${c}"] .inb`).appendChild(el);sel=null;beep(true);
      if(--left===0)done(err<=1,err?`fallos: ${err}`:'');
    }else{err++;shakeEl(el);beep(false);sel=null;el.classList.remove('sel')}
  };
  st.querySelectorAll('[data-w]').forEach(el=>{const i=+el.dataset.w;
    drag(el,t=>{if(t&&t.dataset.drop!==undefined)put(i,t.dataset.drop)},()=>{
      st.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));sel=i;el.classList.add('sel')});});
  st.querySelectorAll('.basket').forEach(b=>b.onclick=()=>{if(sel!==null)put(sel,b.dataset.drop)});
};

  rs.forEach(b=>b.onclick=()=>{

};

R.clock=(q,st,done)=>{
  let h=q.h%12+1,half=!q.half;
  const svg=()=>{
    const ah=(h%12)*30+(half?15:0),am=half?180:0;
    let s=`<svg viewBox="0 0 220 220" class="clock"><circle cx="110" cy="110" r="104" fill="#fff" stroke="#4c6ef5" stroke-width="8"/>`;
    for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;s+=`<text x="${110+82*Math.sin(a)}" y="${110-82*Math.cos(a)+8}" text-anchor="middle" font-size="22" font-weight="700" fill="#2b2d42">${i}</text>`}
    s+=`<line x1="110" y1="110" x2="110" y2="50" stroke="#f76707" stroke-width="7" stroke-linecap="round" transform="rotate(${am} 110 110)"/>
    <line x1="110" y1="110" x2="110" y2="68" stroke="#2b2d42" stroke-width="10" stroke-linecap="round" transform="rotate(${ah} 110 110)"/><circle cx="110" cy="110" r="8" fill="#2b2d42"/></svg>`;
    return s;
  };
  const draw=()=>{
    st.innerHTML=`${svg()}<div class="counter" id="hv">${h}</div>
    <div class="row"><button class="btn small" id="hm">◀ hora</button><button class="btn small" id="hp">hora ▶</button></div>
    <div class="row"><button class="btn small ${half?'grey':'orange'}" id="m0">en punto</button><button class="btn small ${half?'orange':'grey'}" id="m1">y media</button></div>
    <button class="btn green" id="ok">¡Listo! ✅</button>`;
    st.querySelector('#hm').onclick=()=>{h=h===1?12:h-1;draw()};
    st.querySelector('#hp').onclick=()=>{h=h===12?1:h+1;draw()};
    st.querySelector('#m0').onclick=()=>{half=false;draw()};
    st.querySelector('#m1').onclick=()=>{half=true;draw()};
    st.querySelector('#ok').onclick=()=>{st.querySelectorAll('button').forEach(x=>x.disabled=true);done(h===q.h&&half===q.half,`eran las ${q.h} ${q.half?'y media':'en punto'}`)};
  };
  draw();
};

function confetti(k){
  const f=document.createElement('div');f.className='fx';
  const em=['🎉','⭐','✨','🌟','🎈','💫'];
  for(let i=0;i<k;i++){const s=document.createElement('span');s.textContent=pick(em);s.style.left=rnd(2,95)+'%';s.style.animationDelay=(Math.random()*.5)+'s';s.style.fontSize=rnd(18,34)+'px';f.appendChild(s)}
  document.body.appendChild(f);setTimeout(()=>f.remove(),2600);
}

function play(k,i){
  const lv=CONT[S.grade][k][i];const N=10;let n=0,ok=0,streak=0,seen=new Set();
  const next=()=>{
    if(n>=N)return finish();
    const d=n/(N-1);let q,t=0;
    do{q=lv.gen(d);t++}while(seen.has(q.q+(q.vis||'')+JSON.stringify(q.tiles||q.items||q.pairs||''))&&t<10);
    seen.add(q.q+(q.vis||'')+JSON.stringify(q.tiles||q.items||q.pairs||''));
    const type=q.type||'mc';
    render(`${topbar(true)}
    <div class="bar"><div style="width:${n/N*100}%"></div></div>
    <div class="card"><div class="top"><span>Pregunta ${n+1}/${N}</span><button class="btn small" id="say">🔊 Escuchar</button></div>
    <div class="q">${q.q}</div><div id="stage"></div><div class="fb" id="fb"></div></div>`);
    $.querySelector('#back').onclick=()=>map(k);
    const txt=q.q+'. '+((q.vis||'').replace(/(\p{Extended_Pictographic}️?)+/gu,' '));
    $.querySelector('#say').onclick=()=>speak(txt);
    if(S.grade==='1')speak(txt);
    let locked=false;
    const answer=(good,extra)=>{
      if(locked)return;locked=true;
      S.stats[k]=S.stats[k]||{ok:0,total:0};S.stats[k].total++;
      const fb=$.querySelector('#fb');
      if(good){ok++;streak++;S.stats[k].ok++;fb.textContent=pick(['¡Muy bien! 🎉','¡Genial! 🌟','¡Eso es! 👏','¡Correcto! 💪']);if(streak>=3)fb.textContent+=` 🔥 Racha de ${streak}`;beep(true);confetti(10)}
      else{streak=0;fb.textContent='Casi… '+(extra||'')+' 💡';beep(false)}
      fb.classList.add('pop');save();n++;setTimeout(next,good?1100:2400);
    };
    R[type](q,$.querySelector('#stage'),answer);
  };
  const finish=()=>{
    const st=ok>=9?3:ok>=7?2:ok>=5?1:0;
    const key=`${S.grade}-${k}-${i}`;const prev=S.stars[key]||0;
    const gain=ok*2+(st>prev?(st-prev)*5:0);
    if(st>prev)S.stars[key]=st;S.coins+=gain;S.played++;save();
    const last=i===CONT[S.grade][k].length-1;
    render(`${topbar()}<div class="card"><div class="big">${st>0?'🎉':'💪'}</div>
    <h1>${st>0?'¡Nivel superado!':'¡Casi lo consigues!'}</h1>
    <div class="q">${ok} de ${N} bien</div><div class="big stars">${stars(st)}</div>
    <div class="q">+${gain} 🪙</div>
    ${st===0?'<p style="text-align:center">Necesitas 5 aciertos para ganar una estrella. ¡Otra vez!</p>':''}
    <button class="btn green" id="again">🔁 Repetir</button>
    ${st>0&&!last?'<button class="btn" id="nx">➡️ Siguiente nivel</button>':''}
    <button class="btn grey" id="mp">🗺️ Volver al mapa</button></div>`);
    if(st>0)confetti(st*14);
    $.querySelector('#again').onclick=()=>play(k,i);
    const nx=$.querySelector('#nx');if(nx)nx.onclick=()=>play(k,i+1);
    $.querySelector('#mp').onclick=()=>map(k);
  };
  next();
}

function shop(msg){
  render(`${topbar(true)}<h1>🎁 Tienda</h1><p style="text-align:center">${msg||'Estos premios se ponen junto a tu compañero.'}</p>
  ${PREMIOS.map(([e,c])=>{const own=S.prizes.includes(e);return `<div class="card subj"><span class="ic">${e}</span><div style="flex:1">${c} 🪙</div>
  <button class="btn small ${own?'grey':'green'}" data-e="${e}" data-c="${c}">${own?'Tuyo ✓':'Comprar'}</button></div>`}).join('')}`);
  $.querySelector('#back').onclick=home;
  $.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
    const e=b.dataset.e,c=+b.dataset.c;if(S.prizes.includes(e))return;
    if(S.coins<c){shop('Aún no tienes monedas suficientes. ¡Sigue jugando! 💪');return}
    S.coins-=c;S.prizes.push(e);save();shop();
  });
}

function parents(){
  const rows=['1','2'].flatMap(g=>Object.keys(SUBJ).flatMap(k=>CONT[g][k].map((l,i)=>{
    const s=S.stars[`${g}-${k}-${i}`]||0;return `<tr><td>${g}.º</td><td>${SUBJ[k].name}</td><td>${l.name}</td><td>${s?stars(s):'—'}</td></tr>`}))).join('');
  const acc=k=>{const s=S.stats[k];return s&&s.total?Math.round(s.ok/s.total*100)+'% ('+s.ok+'/'+s.total+')':'sin datos'};
  render(`${topbar(true)}<h1>Panel de padres</h1>
  <div class="card"><b>Jugador:</b> ${esc(S.name)} · ${S.grade}.º de Primaria<br><b>Partidas:</b> ${S.played}<br>
  <b>Aciertos Matemáticas:</b> ${acc('mates')}<br><b>Aciertos Lengua:</b> ${acc('lengua')}</div>
  <div class="card"><table><tr><th>Curso</th><th>Área</th><th>Nivel</th><th>Nota</th></tr>${rows}</table></div>
  <div class="card"><b>Cambiar de curso</b> (conserva el progreso de ambos):
  <button class="btn" id="sw">Pasar a ${S.grade==='1'?'2.º':'1.º'} de Primaria</button>
  <button class="link" id="rs">Borrar todo el progreso</button><span id="rsq"></span></div>`);
  $.querySelector('#back').onclick=home;
  $.querySelector('#sw').onclick=()=>{S.grade=S.grade==='1'?'2':'1';save();home()};
  $.querySelector('#rs').onclick=()=>{$.querySelector('#rsq').innerHTML=' <b>¿Seguro?</b> <button class="link" id="rs2">Sí, borrar</button>';$.querySelector('#rs2').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;start()}};
}
start();
</script>
</body>
</html>
